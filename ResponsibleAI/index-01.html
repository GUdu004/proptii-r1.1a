<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proptii - Find Your Dream Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&family=Archivo:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            /* background-image: url('Image/Bkg.png'); */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* ===================== HEADER ===================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2596be;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: #2596be;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .sign-in-btn {
            background: #f26522;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .sign-in-btn:hover {
            background: #d95a1e;
        }

        /* ===================== MAIN ===================== */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .toggle-container {
            display: flex;
            background: white;
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 30px;
        }

        .toggle-btn {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            background: transparent;
            color: #333;
        }

        .toggle-btn.active {
            background: #f26522;
            color: white;
        }

        h1 {
            color: white;
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .subtitle {
            color: white;
            font-size: 18px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .search-container {
            background: white;
            border-radius: 15px;
            padding: 20px 25px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .search-input {
            width: 100%;
            border: none;
            font-size: 16px;
            color: #999;
            outline: none;
            margin-bottom: 15px;
        }

        .search-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
        }

        .provider-badges {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-proptii {
            color: #2596be;
        }

        .badge-otm {
            border: 1px solid #333;
            color: #333;
        }

        .search-btn {
            width: 45px;
            height: 45px;
            background: #f26522;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            background: #d95a1e;
        }

        .try-asking {
            margin-top: 30px;
            text-align: center;
        }

        .try-asking-label {
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .suggestion-pill {
            background: rgba(255, 255, 255, 0.9);
            color: #2596be;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            display: inline-block;
            cursor: pointer;
        }

        .suggestion-pill:hover {
            background: white;
        }

        /* ===================== TOAST NOTIFICATION ===================== */
        .rai-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9000;
            width: 520px;
            background: #e9f4fa;
            font-family: 'Nunito', 'Inter', sans-serif;
            border-bottom: 3px solid #2596be;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 16px 20px;
            gap: 14px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .rai-toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .rai-toast-icon {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border: 2px solid #2596be;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2596be;
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .rai-toast-text {
            flex: 1;
            min-width: 0;
        }

        .rai-toast-title {
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #2596be;
            margin-bottom: 2px;
        }

        .rai-toast-subtitle {
            font-size: 13px;
            color: #5a7d8a;
        }

        .rai-toast-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .rai-toast-link {
            font-size: 13px;
            color: #3a5a6a;
            white-space: nowrap;
            cursor: pointer;
        }

        .rai-toast-link:hover {
            text-decoration: underline;
        }

        .rai-toast-divider {
            width: 1px;
            height: 20px;
            background: #b0c4cc;
        }

        .rai-toast-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #5a7d8a;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }

        .rai-toast-close:hover {
            color: #2596be;
        }

        /* ===================== MODAL BACKDROP ===================== */
        .rai-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9500;
            background: rgba(0, 0, 0, 0.70);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .rai-backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===================== EXPANDED MODAL ===================== */
        .rai-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 10000;
            transform: translate(-50%, -50%) scale(0.95);
            width: 440px;
            max-height: 90vh;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
        }

        .rai-modal.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .rai-modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 19px;
            color: #2c3e50;
            cursor: pointer;
            z-index: 2;
            line-height: 1;
            font-weight: 300;
        }

        .rai-modal-close:hover {
            color: #000;
        }

        .rai-modal-body {
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .rai-modal-main {
            padding: 40px 36px 24px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .rai-modal-title {
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 16.2px;
            color: #1a1a2e;
            margin-bottom: 8px;
            line-height: 1.3;
            text-align: center;
        }

        .rai-modal-intro {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            margin-bottom: 20px;
            color: #5a6a7a;
            line-height: 1.5;
            text-align: center;
            max-width: 260px;
        }

        .rai-modal-illustration-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .rai-modal-illustration-container img {
            width: 220px;
            height: auto;
            opacity: 0;
            transform: scale(0.7);
        }

        .rai-modal.visible .rai-modal-illustration-container img {
            animation: fadeScaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                gentleFloat 3s ease-in-out 0.6s infinite;
        }

        @keyframes fadeScaleIn {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gentleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .rai-modal-section-title {
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #1a1a2e;
            margin-bottom: 14px;
            text-align: center;
        }

        .rai-modal-section-intro {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #5a6a7a;
            margin-bottom: 0;
            line-height: 1.6;
            text-align: center;
        }

        .rai-modal-bullets {
            font-family: 'Inter', sans-serif;
            list-style-type: disc;
            padding-left: 20px;
            margin-bottom: 0;
            width: 100%;
            align-self: flex-start;
        }

        .rai-modal-bullets li {
            font-size: 12px;
            color: #5a6a7a;
            margin-bottom: 0;
            line-height: 1.6;
        }

        .rai-modal-bullets li::marker {
            color: #2c3e50;
            font-size: 9px;
        }

        .rai-modal-callout {
            border-top: 1px solid #e8e8e8;
            padding: 20px 36px;
            font-size: 12px;
            color: #5a6a7a;
            line-height: 1.6;
            font-family: 'Inter', sans-serif;
            margin-top: auto;
        }

        .rai-modal-callout strong {
            font-weight: 700;
            color: #1a1a2e;
            display: block;
            margin-bottom: 2px;
        }

        /* Navigation arrows */
        .rai-modal-nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 32px;
            color: #c0c8d0;
            z-index: 10;
            padding: 8px;
            line-height: 1;
            transition: color 0.2s;
        }

        .rai-modal-nav-arrow:hover {
            color: #5a6a7a;
        }

        .rai-modal-nav-arrow.arrow-right {
            right: -40px;
        }

        .rai-modal-nav-arrow.arrow-left {
            left: -40px;
        }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 680px) {
            .rai-modal {
                width: 90vw;
                max-height: 85vh;
            }

            .rai-toast {
                width: calc(100vw - 24px);
                right: 12px;
                top: 12px;
            }

            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>
    <!-- ============ HEADER ============ -->
    <header>
        <div class="logo">
            <img src="Image/proptii-logo.png" alt="Proptii" style="height: 36px;">
        </div>
        <nav>
            <a href="#">Book Viewing</a>
            <a href="#">Referencing</a>
            <a href="#">Contracts</a>
        </nav>
        <button class="sign-in-btn">Sign In</button>
    </header>

    <!-- ============ MAIN CONTENT ============ -->
    <main>
        <div class="toggle-container">
            <button class="toggle-btn active">Tenant</button>
            <button class="toggle-btn">Agent</button>
        </div>

        <h1>Find Your Dream Home</h1>
        <p class="subtitle">We make finding and securing your home easy, every step of the way.</p>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="AI-assisted property search...">
            <div class="search-bottom">
                <div class="search-icons">
                    <span class="icon">📷</span>
                    <span class="icon">🎤</span>
                    <div class="provider-badges">
                        <span class="badge badge-proptii">🏠 proptii</span>
                        <span class="badge badge-otm">OnTheMarket</span>
                    </div>
                </div>
                <button class="search-btn">✨</button>
            </div>
        </div>

        <div class="try-asking">
            <p class="try-asking-label">Try asking:</p>
            <div class="suggestion-pill">2 bedroom flats to rent in Leeds for 1200pcm</div>
        </div>
    </main>

    <!-- ============ TOAST NOTIFICATION ============ -->
    <div class="rai-toast" id="raiToast">
        <div class="rai-toast-icon">i</div>
        <div class="rai-toast-text">
            <div class="rai-toast-title" id="raiToastTitle"></div>
            <div class="rai-toast-subtitle">How we safely use AI in our work</div>
        </div>
        <div class="rai-toast-actions">
            <span class="rai-toast-link">Find out more</span>
            <div class="rai-toast-divider"></div>
            <button class="rai-toast-close" id="raiToastClose" aria-label="Close">&times;</button>
        </div>
    </div>

    <!-- ============ MODAL BACKDROP ============ -->
    <div class="rai-backdrop" id="raiBackdrop"></div>

    <!-- ============ EXPANDED MODAL ============ -->
    <div class="rai-modal" id="raiModal">
        <button class="rai-modal-close" id="raiModalClose" aria-label="Close">&times;</button>
        <div class="rai-modal-body" id="raiModalBody">
            <!-- Dynamically populated with img tags -->
        </div>
    </div>

    <!-- ============ JAVASCRIPT ============ -->
    <script>
        (function () {
            /* ---- Variant data ---- */
            const variants = [
                {
                    id: 'fairness',
                    toastTitle: 'Fairness First',
                    image: 'SVG/Fairness%20First%20illustration.svg',
                    modalTitle: 'We Built Fairness Into Our Code',
                    modalIntro: 'At Proptii, our AI doesn\'t just work - it works fairly for everyone.',
                    sectionTitle: 'What this means for you:',
                    sectionIntro: 'At Proptii, we believe AI should treat everyone equally. To ensure we comply with Fair Housing regulations, we have engineered our models to strictly ignore "toxic data" that could lead to bias.',
                    bullets: [
                        'Our systems are specifically designed to comply with Fair Housing laws',
                        'We\'ve removed biased data inputs like arrest records and zip codes that could unfairly impact decisions',
                        'Every AI model is tested for fairness before it ever reaches you'
                    ],
                    calloutBold: 'Real protection.',
                    calloutText: 'If our automated tests detect even a hint of bias, the code literally won\'t deploy. Fairness isn\'t optional here - it\'s built in.'
                },
                {
                    id: 'oversight',
                    toastTitle: 'Human Oversight',
                    image: 'SVG/Human%20Oversight%20Illustration.svg',
                    modalTitle: 'AI Recommends. You Decide.',
                    modalIntro: 'Our AI is powerful, but it never makes final decisions on its own.',
                    sectionTitle: 'How we keep humans in control:',
                    sectionIntro: '',
                    bullets: [
                        'Pricing suggestions require your review and approval',
                        'Our Responsible AI Council (legal, engineering, and customer success experts) oversees all high-risk features',
                        'Every automated recommendation can be overridden by you'
                    ],
                    calloutBold: 'Your judgment matters.',
                    calloutText: 'We design AI to augment your expertise, not replace it.'
                },
                {
                    id: 'transparency',
                    toastTitle: 'Transparency & Disclosure',
                    image: 'SVG/Transparency%20%26%20Disclosure%20Illustration.svg',
                    modalTitle: 'You Always Know When AI Is Working',
                    modalIntro: 'Transparency isn\'t just a buzzword at Proptii - it\'s a promise.',
                    sectionTitle: 'What we do differently:',
                    sectionIntro: '',
                    bullets: [
                        'When our chatbot assists tenants, they see a clear "AI Assistant" label',
                        'Tenants can always request a human team member with one click',
                        'Our AI only answers from verified sources: your lease agreements and property handbooks'
                    ],
                    calloutBold: 'No surprises.',
                    calloutText: 'If our AI doesn\'t know something, it says "I don\'t know" rather than guessing.'
                },
                {
                    id: 'privacy',
                    toastTitle: 'Privacy Protection',
                    image: 'SVG/Privacy%20Protection%20Illustration.svg',
                    modalTitle: 'Your Data Stays Yours',
                    modalIntro: 'We never mix your business data with competitors\' information.',
                    sectionTitle: 'Our data protection approach:',
                    sectionIntro: '',
                    bullets: [
                        'Each client\'s data is completely isolated we call it "the clean room"',
                        'Your lease information never trains models that benefit other properties',
                        'We comply with GDPR and maintain strict data privacy controls'
                    ],
                    calloutBold: 'Competitive advantage preserved.',
                    calloutText: 'Your proprietary information remains exactly that: yours.'
                },
                {
                    id: 'monitoring',
                    toastTitle: 'Continuous Monitoring',
                    image: 'SVG/Continuous%20Monitoring%20Illustration.svg',
                    modalTitle: 'We Watch Our AI Around the Clock',
                    modalIntro: 'Responsible AI isn\'t a one-time checkbox—it\'s continuous work.',
                    sectionTitle: 'How we stay vigilant:',
                    sectionIntro: '',
                    bullets: [
                        'Real-time monitoring detects if models drift toward bias as data changes',
                        'Automated alerts notify our team immediately if fairness metrics slip',
                        'Regular audits ensure our AI performs as intended, not just at launch but every day'
                    ],
                    calloutBold: 'Always improving.',
                    calloutText: 'We treat AI ethics like code quality: it\'s measured, monitored, and maintained constantly.'
                }
            ];

            /* ---- DOM references ---- */
            const toast = document.getElementById('raiToast');
            const toastTitle = document.getElementById('raiToastTitle');
            const toastClose = document.getElementById('raiToastClose');
            const backdrop = document.getElementById('raiBackdrop');
            const modal = document.getElementById('raiModal');
            const modalBody = document.getElementById('raiModalBody');
            const modalCallout = document.getElementById('raiModalCallout');
            const modalClose = document.getElementById('raiModalClose');

            let autoHideTimer = null;
            let currentVariant = null;

            /* ---- LocalStorage helpers ---- */
            const STORAGE_KEY = 'proptii_rai_seen';

            function getSeenIds() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
                catch { return []; }
            }

            function markSeen(id) {
                const seen = getSeenIds();
                if (!seen.includes(id)) {
                    seen.push(id);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(seen));
                }
            }

            function getNextVariant() {
                const lastId = localStorage.getItem(STORAGE_KEY);
                /* Pick a random variant that isn't the same as last time */
                const pool = variants.filter(v => v.id !== lastId);
                const pick = pool[Math.floor(Math.random() * pool.length)];
                localStorage.setItem(STORAGE_KEY, pick.id);
                return pick;
            }

            /* ---- Toast ---- */
            function showToast(variant) {
                currentVariant = variant;
                toastTitle.textContent = variant.toastTitle;
                toast.classList.add('visible');

                autoHideTimer = setTimeout(() => {
                    hideToast();
                }, 5000);
            }

            function hideToast() {
                clearTimeout(autoHideTimer);
                toast.classList.remove('visible');
            }

            /* ---- Modal ---- */
            let modalPage = 0;

            function buildModalContent(variant, page) {
                modalPage = page;
                const hasTwoPages = variant.id === 'fairness';
                const totalPages = hasTwoPages ? 2 : 1;

                /* Build middle content based on page */
                let middleContent = '';
                if (hasTwoPages && page === 0) {
                    /* Fairness page 1: section title + section intro paragraph */
                    middleContent = `
                        <h3 class="rai-modal-section-title">${variant.sectionTitle}</h3>
                        <p class="rai-modal-section-intro">${variant.sectionIntro}</p>
                    `;
                } else if (hasTwoPages && page === 1) {
                    /* Fairness page 2: bullet list only */
                    middleContent = `
                        <ul class="rai-modal-bullets">
                            ${variant.bullets.map(b => `<li>${b}</li>`).join('')}
                        </ul>
                    `;
                } else {
                    /* Other variants: section title + bullets */
                    middleContent = `
                        <h3 class="rai-modal-section-title">${variant.sectionTitle}</h3>
                        <ul class="rai-modal-bullets">
                            ${variant.bullets.map(b => `<li>${b}</li>`).join('')}
                        </ul>
                    `;
                }

                /* Navigation arrows for Fairness First */
                const rightArrow = (hasTwoPages && page < totalPages - 1)
                    ? '<button class="rai-modal-nav-arrow arrow-right" id="raiModalNextPage" aria-label="Next">&#8250;</button>'
                    : '';
                const leftArrow = (hasTwoPages && page > 0)
                    ? '<button class="rai-modal-nav-arrow arrow-left" id="raiModalPrev" aria-label="Previous">&#8249;</button>'
                    : '';

                modalBody.innerHTML = `
                    <div class="rai-modal-main">
                        ${leftArrow}
                        ${rightArrow}
                        <h2 class="rai-modal-title">${variant.modalTitle}</h2>
                        <p class="rai-modal-intro">${variant.modalIntro}</p>
                        <div class="rai-modal-illustration-container">
                            <img src="${variant.image}" alt="${variant.toastTitle} Illustration" />
                        </div>
                        ${middleContent}
                    </div>
                    <div class="rai-modal-callout">
                        <strong>${variant.calloutBold}</strong>
                        <p style="margin-bottom: 12px; margin-top: 5px;">${variant.calloutText}</p>
                        <a href="responsibleai.html" style="color: #2596be; text-decoration: none; font-weight: 600;">Learn more about our approach &rarr;</a>
                    </div>
                `;

                /* Wire navigation arrows */
                const nextBtn = document.getElementById('raiModalNextPage');
                const prevBtn = document.getElementById('raiModalPrev');
                if (nextBtn) {
                    nextBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        buildModalContent(variant, page + 1);
                    });
                }
                if (prevBtn) {
                    prevBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        buildModalContent(variant, page - 1);
                    });
                }
            }

            function showModal() {
                hideToast();
                buildModalContent(currentVariant, 0);
                backdrop.classList.add('visible');
                modal.classList.add('visible');
            }

            function hideModal() {
                modal.classList.remove('visible');
                backdrop.classList.remove('visible');
                markSeen(currentVariant.id);
            }

            /* ---- Event listeners ---- */
            toast.addEventListener('click', function (e) {
                if (e.target === toastClose || toastClose.contains(e.target)) return;
                showModal();
            });

            toastClose.addEventListener('click', function (e) {
                e.stopPropagation();
                hideToast();
                markSeen(currentVariant.id);
            });

            modalClose.addEventListener('click', hideModal);
            backdrop.addEventListener('click', hideModal);

            /* ---- Init: show first unseen variant after short delay ---- */
            setTimeout(function () {
                const next = getNextVariant();
                showToast(next);
            }, 1000);
        })();
    </script>
</body>

</html>
