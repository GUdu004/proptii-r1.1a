<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsible AI - Proptii</title>
    <!-- Same fonts as index-01.html -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&family=Archivo:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #333;
            min-height: 100vh;
        }

        /* Header styles from index-01.html */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #1B3B5A;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2596be;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .sign-in-btn {
            background: #f26522;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .sign-in-btn:hover {
            background: #d95a1e;
        }

        /* Main Layout */
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .page-title {
            font-family: 'Archivo', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #1B3B5A;
            text-align: center;
            margin-bottom: 12px;
        }

        .page-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 48px;
        }

        /* FAQ Node Styles matching proptii.co/faq */
        .faq-node {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .faq-node.active {
            border-color: rgba(255, 107, 53, 0.2);
        }

        .faq-trigger {
            width: 100%;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            cursor: pointer;
            background: transparent;
            border: none;
            border-left: 4px solid transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .faq-trigger:hover {
            background-color: #FDF8F3;
        }

        .faq-node.active .faq-trigger {
            background: #FDF8F3;
            border-left: 4px solid #FF6B35;
        }

        .faq-trigger-left {
            display: flex;
            align-items: center;
        }

        .faq-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FDF8F3;
            flex-shrink: 0;
        }

        .faq-icon-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #FF6B35;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .faq-node.active .faq-icon-wrapper {
            background: #FDF8F3;
        }

        .faq-title {
            font-size: 18px;
            font-weight: 600;
            color: #1B3B5A;
            margin-left: 16px;
            font-family: 'Archivo', sans-serif;
        }

        .faq-toggle-icon {
            color: #FF6B35;
            font-size: 24px;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            user-select: none;
        }

        /* Content Area */
        .faq-content {
            display: none;
            padding: 20px 24px 24px 84px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            /* Align with text, accommodating icon width+margin */
        }

        .faq-node.active .faq-content {
            display: block;
            animation: slideDown 0.3s ease-out forwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-split {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .illustration-thumbnail {
            width: 140px;
            height: auto;
            flex-shrink: 0;
            margin-top: 8px;
            opacity: 0;
            transform: scale(0.7);
        }

        .faq-node.active .illustration-thumbnail {
            animation: fadeScaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                gentleFloat 3s ease-in-out 0.6s infinite;
        }

        @keyframes fadeScaleIn {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gentleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .content-text {
            flex: 1;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1B3B5A;
            font-family: 'Archivo', sans-serif;
            margin-bottom: 8px;
        }

        .modal-intro {
            color: #4b5563;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: 600;
            color: #1B3B5A;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .section-intro {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .bullets-list {
            list-style-type: none;
            padding-left: 0;
            margin-bottom: 20px;
        }

        .bullets-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            color: #4b5563;
            line-height: 1.5;
            font-size: 14px;
        }

        .bullets-list li::before {
            content: '•';
            color: #FF6B35;
            font-weight: bold;
            position: absolute;
            left: 0;
            top: 0;
        }

        .callout-box {
            padding-top: 16px;
            border-top: 1px solid rgba(255, 107, 53, 0.2);
            color: #4b5563;
            font-size: 14px;
            line-height: 1.6;
        }

        .callout-box strong {
            color: #1B3B5A;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        @media (max-width: 640px) {
            .faq-content {
                padding: 0 20px 20px 20px;
            }

            .content-split {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .illustration-thumbnail {
                margin-bottom: 20px;
            }

            .bullets-list li {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <!-- Header aligned with index-01.html -->
    <header>
        <div class="logo">
            <img src="Image/proptii-logo.png" alt="Proptii" style="height: 36px;">
        </div>
        <nav>
            <a href="#">Book Viewing</a>
            <a href="#">Referencing</a>
            <a href="#">Contracts</a>
        </nav>
        <button class="sign-in-btn">Sign In</button>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">Responsible AI</h1>
        <p class="page-subtitle">How we safely, fairly, and reliably use AI in our approach.</p>

        <div class="faq-accordion" id="faqAccordion">
            <!-- Nodes will be injected here by JS -->
        </div>
    </div>

    <!-- Script to render the variants and handle accordion behavior -->
    <script>
        const variants = [
            {
                id: 'fairness',
                toastTitle: 'Fairness First',
                image: 'SVG/Fairness%20First%20illustration.svg',
                modalTitle: 'We Built Fairness Into Our Code',
                modalIntro: 'At Proptii, our AI doesn\'t just work - it works fairly for everyone.',
                sectionTitle: 'What this means for you:',
                sectionIntro: 'At Proptii, we believe AI should treat everyone equally. To ensure we comply with Fair Housing regulations, we have engineered our models to strictly ignore "toxic data" that could lead to bias.',
                bullets: [
                    'Our systems are specifically designed to comply with Fair Housing laws',
                    'We\'ve removed biased data inputs like arrest records and zip codes that could unfairly impact decisions',
                    'Every AI model is tested for fairness before it ever reaches you'
                ],
                calloutBold: 'Real protection.',
                calloutText: 'If our automated tests detect even a hint of bias, the code literally won\'t deploy. Fairness isn\'t optional here - it\'s built in.'
            },
            {
                id: 'oversight',
                toastTitle: 'Human Oversight',
                image: 'SVG/Human%20Oversight%20Illustration.svg',
                modalTitle: 'AI Recommends. You Decide.',
                modalIntro: 'Our AI is powerful, but it never makes final decisions on its own.',
                sectionTitle: 'How we keep humans in control:',
                sectionIntro: '',
                bullets: [
                    'Pricing suggestions require your review and approval',
                    'Our Responsible AI Council (legal, engineering, and customer success experts) oversees all high-risk features',
                    'Every automated recommendation can be overridden by you'
                ],
                calloutBold: 'Your judgment matters.',
                calloutText: 'We design AI to augment your expertise, not replace it.'
            },
            {
                id: 'transparency',
                toastTitle: 'Transparency & Disclosure',
                image: 'SVG/Transparency%20%26%20Disclosure%20Illustration.svg',
                modalTitle: 'You Always Know When AI Is Working',
                modalIntro: 'Transparency isn\'t just a buzzword at Proptii - it\'s a promise.',
                sectionTitle: 'What we do differently:',
                sectionIntro: '',
                bullets: [
                    'When our chatbot assists tenants, they see a clear "AI Assistant" label',
                    'Tenants can always request a human team member with one click',
                    'Our AI only answers from verified sources: your lease agreements and property handbooks'
                ],
                calloutBold: 'No surprises.',
                calloutText: 'If our AI doesn\'t know something, it says "I don\'t know" rather than guessing.'
            },
            {
                id: 'privacy',
                toastTitle: 'Privacy Protection',
                image: 'SVG/Privacy%20Protection%20Illustration.svg',
                modalTitle: 'Your Data Stays Yours',
                modalIntro: 'We never mix your business data with competitors\' information.',
                sectionTitle: 'Our data protection approach:',
                sectionIntro: '',
                bullets: [
                    'Each client\'s data is completely isolated we call it "the clean room"',
                    'Your lease information never trains models that benefit other properties',
                    'We comply with GDPR and maintain strict data privacy controls'
                ],
                calloutBold: 'Competitive advantage preserved.',
                calloutText: 'Your proprietary information remains exactly that: yours.'
            },
            {
                id: 'monitoring',
                toastTitle: 'Continuous Monitoring',
                image: 'SVG/Continuous%20Monitoring%20Illustration.svg',
                modalTitle: 'We Watch Our AI Around the Clock',
                modalIntro: 'Responsible AI isn\'t a one-time checkbox—it\'s continuous work.',
                sectionTitle: 'How we stay vigilant:',
                sectionIntro: '',
                bullets: [
                    'Real-time monitoring detects if models drift toward bias as data changes',
                    'Automated alerts notify our team immediately if fairness metrics slip',
                    'Regular audits ensure our AI performs as intended, not just at launch but every day'
                ],
                calloutBold: 'Always improving.',
                calloutText: 'We treat AI ethics like code quality: it\'s measured, monitored, and maintained constantly.'
            }
        ];

        const container = document.getElementById('faqAccordion');

        /* SVG line icons for each variant */
        const svgIcons = {
            fairness: '<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 7l7-4 7 4"/><path d="M5 7l-1 6h6L9 7"/><path d="M19 7l-1 6h-6l1-6"/></svg>',
            oversight: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7z"/></svg>',
            transparency: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',
            privacy: '<svg viewBox="0 0 24 24"><path d="M12 2l7 4v5c0 5.25-3.5 9.74-7 11-3.5-1.26-7-5.75-7-11V6l7-4z"/><path d="M9 12l2 2 4-4"/></svg>',
            monitoring: '<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
        };

        variants.forEach((v, index) => {
            const node = document.createElement('div');
            node.className = 'faq-node';

            const iconSvg = svgIcons[v.id] || '';

            const sectionIntroHtml = v.sectionIntro ? `<p class="section-intro">${v.sectionIntro}</p>` : '';
            const bulletsHtml = v.bullets.map(b => `<li>${b}</li>`).join('');

            node.innerHTML = `
                <button class="faq-trigger" aria-expanded="false">
                    <div class="faq-trigger-left">
                        <div class="faq-icon-wrapper">
                            ${iconSvg}
                        </div>
                        <span class="faq-title">${v.toastTitle}</span>
                    </div>
                    <div class="faq-toggle-icon">+</div>
                </button>
                <div class="faq-content">
                    <div class="content-split">
                        <img src="${v.image}" class="illustration-thumbnail" alt="${v.toastTitle} Illustration" onerror="this.style.display='none'">
                        <div class="content-text">
                            <h2 class="modal-title">${v.modalTitle}</h2>
                            <p class="modal-intro">${v.modalIntro}</p>
                            
                            <h3 class="section-title">${v.sectionTitle}</h3>
                            ${sectionIntroHtml}
                            <ul class="bullets-list">
                                ${bulletsHtml}
                            </ul>
                            
                            <div class="callout-box">
                                <strong>${v.calloutBold}</strong> ${v.calloutText}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const trigger = node.querySelector('.faq-trigger');
            const toggleIcon = node.querySelector('.faq-toggle-icon');
            trigger.addEventListener('click', () => {
                const isActive = node.classList.contains('active');

                // Close all other nodes
                document.querySelectorAll('.faq-node').forEach(n => {
                    n.classList.remove('active');
                    n.querySelector('.faq-trigger').setAttribute('aria-expanded', 'false');
                    n.querySelector('.faq-toggle-icon').textContent = '+';
                });

                // Open this node if it was closed
                if (!isActive) {
                    node.classList.add('active');
                    trigger.setAttribute('aria-expanded', 'true');
                    toggleIcon.textContent = '\u2212'; // minus sign
                }
            });

            container.appendChild(node);
        });

        // Open the first node by default for demonstration
        if (container.firstChild) {
            container.firstChild.classList.add('active');
            container.firstChild.querySelector('.faq-trigger').setAttribute('aria-expanded', 'true');
            container.firstChild.querySelector('.faq-toggle-icon').textContent = '\u2212';
        }
    </script>
</body>

</html>
